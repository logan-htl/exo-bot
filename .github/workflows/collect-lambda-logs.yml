name: Collect Lambda logs

on:
  workflow_dispatch:

concurrency:
  group: collect-lambda-logs
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  actions: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exo-bot
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Run collect_lambda_logs
        id: collect
        env:
          LAMBDA_LOG_GROUP: ${{ vars.LAMBDA_LOG_GROUP }}
          LAMBDA_REPORTS_CHECKPOINT_MS: ${{ vars.LAMBDA_REPORTS_CHECKPOINT_MS }}
          DEPLOYMENT_ENVIRONMENT: ${{ vars.DEPLOYMENT_ENVIRONMENT }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: Authorization=Basic%20${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
        run: |
          chmod +x bin/collect_lambda_logs
          ./bin/collect_lambda_logs

      - name: Save the new checkpoint
        if: steps.collect.outputs.checkpoint_ms != ''
        env:
          GH_TOKEN: ${{ secrets.CHECKPOINT_TOKEN }}
        run: gh variable set LAMBDA_REPORTS_CHECKPOINT_MS --body "${{ steps.collect.outputs.checkpoint_ms }}"
