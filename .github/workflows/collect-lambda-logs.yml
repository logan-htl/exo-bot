name: Collect Lambda logs

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  actions: write

jobs:
  collect:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `suffix` picks the repo variables for each environment:
        # stg uses LAMBDA_LOG_GROUP, prd uses LAMBDA_LOG_GROUP_PRD, and so on.
        include:
          - target: stg
            suffix: ""
          - target: prd
            suffix: "_PRD"
    # One run per environment at a time, so checkpoints never race.
    concurrency:
      group: collect-lambda-logs-${{ matrix.target }}
      cancel-in-progress: false
    steps:
      - name: Check out exo-bot
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Run collect_lambda_logs
        id: collect
        env:
          LAMBDA_LOG_GROUP: ${{ vars[format('LAMBDA_LOG_GROUP{0}', matrix.suffix)] }}
          LAMBDA_REPORTS_CHECKPOINT_MS: ${{ vars[format('LAMBDA_REPORTS_CHECKPOINT_MS{0}', matrix.suffix)] }}
          DEPLOYMENT_ENVIRONMENT: ${{ vars[format('DEPLOYMENT_ENVIRONMENT{0}', matrix.suffix)] }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: Authorization=Basic%20${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
        run: |
          chmod +x bin/collect_lambda_logs
          ./bin/collect_lambda_logs

      - name: Save the new checkpoint
        if: steps.collect.outputs.checkpoint_ms != ''
        env:
          GH_TOKEN: ${{ secrets.CHECKPOINT_TOKEN }}
        run: gh variable set LAMBDA_REPORTS_CHECKPOINT_MS${{ matrix.suffix }} --body "${{ steps.collect.outputs.checkpoint_ms }}"
